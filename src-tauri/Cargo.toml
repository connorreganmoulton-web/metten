[package]
name = "metten"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
metten-engine = { path = "../crates/engine" }
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
libc = "0.2.191"
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
