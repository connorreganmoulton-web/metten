name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac-foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: npm ci
      - run: python3 tests/credential-runner.test.py
      - run: python3 tests/check-staged.test.py
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - name: Controlled full-hour history acceptance
        run: cargo test -p metten-engine --release --locked --test strategy -- --ignored --nocapture
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run tauri build -- --bundles app
